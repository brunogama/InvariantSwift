# SwiftLint Configuration for Tests
# More permissive rules for test code

# Relaxed rules for test files
file_length:
  warning: 1000
  error: 1500

type_body_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 150
  error: 200

cyclomatic_complexity:
  warning: 20
  error: 30

line_length:
  warning: 120
  error: 150

nesting:
  type_level: 2
  function_level: 5

# Disable rules that are too strict for tests
disabled_rules:
  - force_unwrapping  # Tests often use ! for known values
  - force_try  # Tests can use try! for known-safe operations
  - implicitly_unwrapped_optional  # Test fixtures may use IUO
  - function_parameter_count  # Test helpers may have many parameters
  - type_name  # Test type names can be descriptive
  - file_name  # Test file names can be flexible

# Paths to include
included:
  - ${PWD}

# Opt-in rules that make sense for tests
opt_in_rules:
  - empty_count
  - empty_string
  - array_init
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding
