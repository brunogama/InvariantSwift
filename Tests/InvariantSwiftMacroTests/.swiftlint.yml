# Custom SwiftLint configuration for macro tests
# Overrides root .swiftlint.yml for this directory

# Macro expansion tests have legitimately long test functions and types
# - line_length: swift-format prioritizes keeping function output together
# - function_body_length: assertMacroExpansion calls contain complete expected expansions
# - type_body_length: comprehensive test suites are cohesive and shouldn't be split
# - blanket_disable_command: needed to disable above rules for entire file
disabled_rules:
  - line_length
  - function_body_length
  - type_body_length
  - blanket_disable_command

# Keep other rules from parent config
opt_in_rules:
  - closure_parameter_position
  - identical_operands
