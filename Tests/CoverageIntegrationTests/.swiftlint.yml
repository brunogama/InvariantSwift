# Custom SwiftLint configuration for coverage integration tests
# Overrides root .swiftlint.yml for this directory

# Coverage integration tests are comprehensive and legitimately long
# - file_length: Final validation tests include exhaustive API coverage (1145 lines)
# - type_body_length: Comprehensive test suites are cohesive and shouldn't be split (780 lines)
# - function_body_length: Integration tests exercise multiple subsystems in single test (156-160 lines)
# - cyclomatic_complexity: Coverage tests validate many edge cases and paths (23-25 complexity)
# - attributes: @Test and @available attributes must be adjacent for Swift Testing
# - line_length: Coverage assertions include descriptive property names and full context (101-109 chars)
# - closure_parameter_position: swift-format reformats closures causing conflicts with this rule
disabled_rules:
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - attributes
  - line_length
  - closure_parameter_position

# Keep other rules from parent config
opt_in_rules:
  - identical_operands
