name: Commit Lint

# Runs on every push and every PR, for every branch.
# Enforces Conventional Commits and rejects AI agent co-author trailers.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci --prefer-offline

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FROM="$PR_BASE"
            TO="$PR_HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FROM="HEAD~1"
            TO="HEAD"
          elif git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            FROM="$BEFORE"
            TO="$AFTER"
          else
            FROM=$(git merge-base "$AFTER" "origin/$DEFAULT_BRANCH")
            TO="$AFTER"
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"

      - name: Validate commits
        run: |
          npx commitlint \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --config commitlint.config.js \
            --verbose

      - name: Reject AI co-author trailers
        run: |
          MESSAGES=$(git log --format="%B" \
            "${{ steps.range.outputs.from }}..${{ steps.range.outputs.to }}")

          # Check for AI agent co-author trailers (case-insensitive).
          AI_PATTERN='(?i)^Co-Authored-By:.*\b(claude|anthropic|copilot|'
          AI_PATTERN+='github-actions\[bot\]|gemini|chatgpt|openai)\b'
          if echo "${MESSAGES}" | grep -Pq "${AI_PATTERN}"; then
            echo "::error::AI agent Co-Authored-By trailers found in commits."
            echo ""
            echo "Offending lines:"
            echo "${MESSAGES}" | grep -Pi "${AI_PATTERN}"
            exit 1
          fi

          echo "No AI co-author trailers found."
