name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test-linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Test on Linux
        run: swift test | xcbeautify || true

  macro-golden-tests:
    name: Macro Golden Tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run Macro Golden Tests
        run: swift test --filter MacroGoldenTests

  xcodebuild-latest:
    name: xcodebuild (16.4)
    runs-on: macos-15
    strategy:
      matrix:
        command: [test, '']
        platform: [IOS, MACOS, TVOS]
        xcode: ['16.4']
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Update xcbeautify
        run: brew update && brew upgrade xcbeautify
      - name: List available devices
        run: xcrun simctl list devices available
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/.derivedData
          key: |
            deriveddata-xcodebuild-${{ matrix.platform }}-${{ matrix.xcode }}-${{ matrix.command }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: |
            deriveddata-xcodebuild-${{ matrix.platform }}-${{ matrix.xcode }}-${{ matrix.command }}-
      - name: Set IgnoreFileSystemDeviceInodeChanges flag
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - name: Update mtime for incremental builds
        uses: chetan/git-restore-mtime-action@v2
      - name: Build and Test
        run: |
          if [ "${{ matrix.command }}" = "test" ]; then
            make test-${{ matrix.platform }}
          else
            make build
          fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint

  format-check:
    name: swift-format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: |
          # Create a copy to check formatting
          cp -r . /tmp/original
          # Apply formatting
          swift-format -i --configuration .swift-format --recursive \
            ./Package.swift ./Sources ./Tests
          # Check if any files were modified
          if ! git diff --quiet; then
            echo "❌ Code is not formatted. Run 'make format' to fix."
            echo "Files that need formatting:"
            git diff --name-only
            git diff
            exit 1
          else
            echo "✅ All code is properly formatted"
          fi

  coverage:
    name: Code Coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Generate coverage report
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/FunctionalTestingPackageTests.xctest/Contents/MacOS/FunctionalTestingPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false