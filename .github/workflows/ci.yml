name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MARK: - Workspace Sub-Package Builds (Parallel)
  # These jobs build the sub-packages independently for faster CI

  build-core:
    name: Build Core (No SwiftSyntax)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.swiftpm
            Packages/InvariantSwiftCore/.build
          key: swiftpm-core-${{ runner.os }}-${{ hashFiles('Packages/InvariantSwiftCore/**/*.swift') }}
          restore-keys: |
            swiftpm-core-${{ runner.os }}-
      - name: Build InvariantSwiftCore
        run: swift build --package-path Packages/InvariantSwiftCore
      - name: Test InvariantSwiftCore
        run: swift test --package-path Packages/InvariantSwiftCore

  build-macros:
    name: Build Macros (SwiftSyntax)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Cache SwiftSyntax Prebuilts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.swiftpm/swift-syntax-prebuilts
          key: swift-syntax-prebuilts-${{ runner.os }}
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.swiftpm
            Packages/InvariantSwiftMacros/.build
          key: swiftpm-macros-${{ runner.os }}-${{ hashFiles('Packages/InvariantSwiftMacros/**/*.swift') }}
          restore-keys: |
            swiftpm-macros-${{ runner.os }}-
      - name: Build InvariantSwiftMacros with Prebuilts
        run: swift build --package-path Packages/InvariantSwiftMacros --enable-experimental-prebuilts
      # NOTE: Tests not migrated yet - uncomment when ready
      # - name: Test InvariantSwiftMacros
      #   run: swift test --package-path Packages/InvariantSwiftMacros --enable-experimental-prebuilts

  # MARK: - Linux Tests
  swift-test-linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.2-jammy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test on Linux
        run: swift test | xcbeautify || true

  macro-golden-tests:
    name: Macro Golden Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Setup Swift 6.2.4
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.2.4'
      - name: Run Macro Golden Tests
        run: swift test --filter MacroGoldenTests

  # MARK: - Integration Tests (after sub-packages build)
  integration:
    name: Integration Tests
    runs-on: macos-15
    timeout-minutes: 30
    needs: [build-core, build-macros]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Setup Swift 6.2.4
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.2.4'
      - name: Cache SwiftSyntax Prebuilts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.swiftpm/swift-syntax-prebuilts
          key: swift-syntax-prebuilts-${{ runner.os }}
      - name: Build Full Package with Prebuilts
        run: swift build --enable-experimental-prebuilts
      - name: Run Integration Tests
        run: swift test --filter CoverageIntegrationTests --enable-experimental-prebuilts || true

  # MARK: - Xcode Platform Tests
  xcodebuild-latest:
    name: xcodebuild (26.3)
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        command: [test, '']
        platform: [IOS, MACOS, TVOS]
        xcode: ['26.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Xcode 26 bundles Swift 6.2, the minimum for the Testing.Attachment
      # API used by InvariantSwiftTestingIntegration. Use Xcode's own
      # toolchain rather than pointing xcodebuild at a swiftly-provisioned
      # one via -toolchain: that combination fails package resolution with
      # "unable to execute command: <unknown>" (exit 74).
      - name: Setup Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Update xcbeautify
        run: brew update && brew upgrade xcbeautify
      - name: List available devices
        run: xcrun simctl list devices available
      - name: Cache derived data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.derivedData
          key: |
            deriveddata-xcodebuild-${{ matrix.platform }}-${{ matrix.xcode }}-${{ matrix.command }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: |
            deriveddata-xcodebuild-${{ matrix.platform }}-${{ matrix.xcode }}-${{ matrix.command }}-
      - name: Set IgnoreFileSystemDeviceInodeChanges flag
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - name: Update mtime for incremental builds
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2
      - name: Build and Test
        run: |
          if [ "${{ matrix.command }}" = "test" ]; then
            case "${{ matrix.platform }}" in
              IOS)
                set -o pipefail
                xcodebuild test \
                  -scheme InvariantSwift \
                  -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
                  | xcbeautify
                ;;
              MACOS)
                set -o pipefail
                xcodebuild test \
                  -scheme InvariantSwift \
                  -destination 'platform=macOS' \
                  | xcbeautify
                ;;
              TVOS)
                set -o pipefail
                xcodebuild test \
                  -scheme InvariantSwift \
                  -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest' \
                  | xcbeautify
                ;;
            esac
          else
            swift build --enable-experimental-prebuilts
          fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint

  format-check:
    name: swift-format
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: |
          # Create a copy to check formatting
          cp -r . /tmp/original
          # Apply formatting
          swift-format -i --configuration .swift-format --recursive \
            ./Package.swift ./Sources ./Tests
          # Check if any files were modified
          if ! git diff --quiet; then
            echo "❌ Code is not formatted. Run 'just format' to fix."
            echo "Files that need formatting:"
            git diff --name-only
            git diff
            exit 1
          else
            echo "✅ All code is properly formatted"
          fi

  coverage:
    name: Code Coverage
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.2.4'
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: swiftpm-coverage-${{ runner.os }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift') }}
          restore-keys: |
            swiftpm-coverage-${{ runner.os }}-
      - name: Swift Version
        run: swift --version
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
      - name: Generate coverage report
        run: |
          TEST_BINARY="$(find .build -path '*InvariantSwiftPackageTests.xctest/Contents/MacOS/InvariantSwiftPackageTests' -type f | head -1)"
          if [ -z "$TEST_BINARY" ]; then
            echo "Unable to locate InvariantSwiftPackageTests binary for coverage export"
            exit 1
          fi
          xcrun llvm-cov export -format="lcov" \
            "$TEST_BINARY" \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
