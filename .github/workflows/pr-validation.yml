name: PR Validation

on:
  pull_request:
    # No `edited`: it fires when a pull request's title or body changes, which
    # leaves the tree untouched but re-runs the whole macOS matrix and cancels
    # the in-flight run for the same commit. `synchronize` already covers new
    # commits.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Strict format check - MUST pass
  format-check:
    name: Format Check
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install swift-format
        run: brew install swift-format

      - name: Check Formatting
        run: |
          swift-format -i --configuration .swift-format --recursive \
            ./Package.swift ./Sources ./Tests
          if ! git diff --quiet; then
            echo "::error::Code is not properly formatted. Run 'just format' locally."
            exit 1
          fi

  # Strict lint check - MUST pass
  lint-check:
    name: SwiftLint Strict
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check for Forbidden Disable Tags
        run: |
          echo "Checking for blanket swiftlint disable directives affecting all rules..."
          pattern='swiftlint:disable(:next|:this)?[[:space:]]+([^[:space:]]+[[:space:]]+)*all([[:space:]]|$)'
          if grep -rnE "$pattern" Sources/ Tests/ \
            --include="*.swift" --exclude-dir="Tests/Generated"; then
            echo "::error::Blanket swiftlint disable directives affecting all rules are forbidden."
            exit 1
          fi
          echo "No blanket disable directives found."

      - name: Run SwiftLint Strict
        # Packages/ too: it holds most of the library, and leaving it out meant
        # nothing under it was ever strict-linted.
        run: |
          if ! swiftlint lint --strict --reporter github-actions-logging Sources/ Tests/ Packages/; then
            echo "::error::SwiftLint violations found. All issues must be fixed."
            exit 1
          fi

  # Build with warnings as errors - MUST pass
  build-check:
    name: Build (Warnings = Errors)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Setup Swift 6.2.4
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.2.4'

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: swiftpm-pr-validation-${{ runner.os }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-pr-validation-${{ runner.os }}-

      - name: Swift Version
        run: swift --version

      - name: Build with Strict Warnings
        run: swift build -Xswiftc -warnings-as-errors

  # All tests MUST pass
  test-check:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 30
    needs: build-check

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Setup Swift 6.2.4
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.2.4'

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: swiftpm-pr-validation-${{ runner.os }}-${{ hashFiles('**/Sources/**/*.swift', '**/Tests/**/*.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-pr-validation-${{ runner.os }}-

      - name: Swift Version
        run: swift --version

      - name: Run All Tests
        run: swift test --parallel

  # Danger validation
  danger-check:
    name: Danger
    runs-on: macos-14
    timeout-minutes: 10
    needs: [format-check, lint-check]
    # Danger posts its report as a pull request comment, so this job needs more
    # than the workflow's read-only default.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Danger
        # Pinned to 3.22.1: the 3.23.0 bottle is missing libDanger.dylib,
        # causing "Could not find a libDanger to link against" at runtime.
        run: |
          brew tap danger/tap
          brew trust --formula danger/tap/danger-swift
          brew trust --formula danger/tap/danger-js
          git -C "$(brew --repository danger/tap)" checkout 5e30e8102a960b552040b0e83d4a24aa18489893
          brew install danger/tap/danger-swift

      - name: Run Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: danger-swift ci --fail-on-errors

  # Final gate - all checks must pass
  pr-ready:
    name: PR Ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [format-check, lint-check, build-check, test-check, danger-check]
    if: always()

    steps:
      - name: Check All Jobs
        run: |
          if [ "${{ needs.format-check.result }}" != "success" ]; then
            echo "::error::Format check failed"
            exit 1
          fi
          if [ "${{ needs.lint-check.result }}" != "success" ]; then
            echo "::error::Lint check failed"
            exit 1
          fi
          if [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "::error::Build check failed"
            exit 1
          fi
          if [ "${{ needs.test-check.result }}" != "success" ]; then
            echo "::error::Test check failed"
            exit 1
          fi
          if [ "${{ needs.danger-check.result }}" != "success" ]; then
            echo "::error::Danger check failed"
            exit 1
          fi
          echo "All checks passed! PR is ready for review."
