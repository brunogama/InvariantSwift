name: governance

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  release-tooling:
    name: release-tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test next version
        run: bash Tools/release/next_version.test.sh

  governance-files:
    name: governance-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify expected governance files exist
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f RULES.md
          test -f WORKFLOW.md
          test -f CONTRIBUTING.md
          test -f RELEASING.md
          test -f CHANGELOG.md
          test -f scripts/gitflow-init.sh
          test -f Tools/release/next_version.test.sh
          test -f skills/gitflow-delivery-guard/SKILL.md
