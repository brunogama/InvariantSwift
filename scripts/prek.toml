minimum_prek_version = "0.4.10"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "shellcheck"
name = "ShellCheck"
language = "system"
entry = "shellcheck"
files = "\\.sh$"

[[repos.hooks]]
id = "node-check"
name = "Node syntax check"
language = "system"
entry = "bash -c 'for file do node --check \"$file\" || exit; done' --"
files = "\\.mjs$"

[[repos.hooks]]
id = "test"
name = "Node tests"
language = "system"
entry = "npm test"
pass_filenames = false
always_run = true
stages = ["pre-push"]
